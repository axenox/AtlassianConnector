info:
  name: GET Accessible Resources
  type: http
  seq: 3

http:
  method: GET
  url: https://api.atlassian.com/oauth/token/accessible-resources
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://auth.atlassian.com/oauth/token
    credentials:
      clientId: "{{cliend_id}}"
      clientSecret: "{{client_secret}}"
      placement: basic_auth_header
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
